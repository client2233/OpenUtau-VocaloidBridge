name: Python checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python bridge/test_host.py
      - run: python bridge/test_score.py
      - run: python bridge/pinyin.py
      - run: python bridge/test_settings.py
      - run: python enunu/test_protocol.py
